    <script>
      try {
        if ("scrollRestoration" in history)
          history.scrollRestoration = "manual";
        if (location.hash) {
          history.replaceState(null, "", location.pathname + location.search);
        }
        window.scrollTo(0, 0);
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) {
              reg.unregister();
            });
          });
        }
        if (window.caches) {
          caches.keys().then(function (keys) {
            keys.forEach(function (key) {
              caches.delete(key);
            });
          });
        }
        window.addEventListener("pageshow", function (event) {
          if (event.persisted) location.reload();
        });
      } catch (e) {}
    </script>

    <!-- First-paint cinematic cover. Reduced-motion skip via inline script. -->
    <div id="stage-boot" class="loading">
      <style>
        #stage-boot.loading {
          position: fixed;
          inset: 0;
          z-index: 99999;
          overflow: hidden;
          background:
            radial-gradient(
              ellipse 58% 38% at 50% -8%,
              rgba(13, 0, 164, 0.22),
              transparent 52%
            ),
            radial-gradient(
              ellipse 30% 24% at 90% 10%,
              rgba(34, 0, 124, 0.16),
              transparent 48%
            ),
            radial-gradient(
              ellipse 26% 22% at 8% 86%,
              rgba(20, 1, 82, 0.18),
              transparent 44%
            ),
            #010005;
          opacity: 1;
          pointer-events: auto;
          transition: opacity 0.62s cubic-bezier(0.22, 1, 0.36, 1);
        }
        #stage-boot.loading.is-exiting {
          opacity: 0;
          pointer-events: none;
        }
        #stage-boot.is-exiting .boot-marquee,
        #stage-boot.is-exiting .boot-welcome,
        #stage-boot.is-exiting .boot-hint {
          opacity: 0;
          transition: none;
        }
        body {
          margin: 0;
          background: #010005;
        }
        /* Crawlable HTML stays in the document. Humans never see this dump. */
        #seo-static-shell {
          display: none !important;
        }
        #stage-boot[data-done="true"] {
          display: none !important;
        }
        @media (min-width: 1024px) {
          html[data-skip-intro] #stage-boot {
            display: none !important;
          }
        }
        #stage-boot .boot-skip {
          display: none;
          position: absolute;
          bottom: max(1.6rem, env(safe-area-inset-bottom));
          left: 50%;
          z-index: 3;
          min-height: 2.75rem;
          padding: 0.65rem 1.25rem;
          border: 1px solid rgba(250, 250, 252, 0.22);
          border-radius: 999px;
          background: transparent;
          color: #fafafc;
          font-family: "Space Grotesk", system-ui, sans-serif;
          font-size: 0.95rem;
          font-weight: 500;
          transform: translateX(-50%);
          pointer-events: auto;
        }
        #stage-boot .boot-hint-tap {
          display: none;
        }
        @media (max-width: 1023px) {
          #stage-boot .boot-hint-esc {
            display: none !important;
          }
          #stage-boot .boot-hint-tap {
            display: block;
          }
          #stage-boot .boot-skip {
            display: none !important;
          }
        }
        @media (hover: none) and (min-width: 1024px) {
          #stage-boot .boot-hint {
            display: none !important;
          }
          #stage-boot .boot-skip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
          }
        }
        #stage-boot .boot-marquee {
          position: absolute;
          top: 50%;
          left: 0;
          width: 100%;
          overflow: hidden;
          transform: translateY(-50%);
          mask-image: linear-gradient(
            90deg,
            transparent,
            #000 8%,
            #000 92%,
            transparent
          );
        }
        #stage-boot .boot-marquee-track {
          display: flex;
          width: max-content;
          gap: 0.6em;
          font-family: "Space Grotesk", system-ui, sans-serif;
          font-size: clamp(2.4rem, 9vw, 8rem);
          font-weight: 600;
          letter-spacing: -0.045em;
          line-height: 0.9;
          text-transform: uppercase;
          color: #fafafc;
          animation: boot-marquee 22s linear infinite;
        }
        #stage-boot .boot-marquee-track span {
          white-space: nowrap;
          padding-right: 0.55em;
        }
        #stage-boot .boot-marquee-track span:nth-child(odd) {
          color: #fafafc;
        }
        #stage-boot .boot-marquee-track span:nth-child(even) {
          background-image: linear-gradient(100deg, #a8a2ff, #948cd6, #7c6cc4);
          background-clip: text;
          -webkit-background-clip: text;
          color: transparent;
        }
        #stage-boot .boot-hint {
          position: absolute;
          bottom: 1.6rem;
          left: 50%;
          z-index: 2;
          margin: 0;
          transform: translateX(-50%);
          font-family: "JetBrains Mono", ui-monospace, monospace;
          font-size: 10px;
          letter-spacing: 0.22em;
          text-transform: uppercase;
          color: rgba(168, 162, 255, 0.55);
        }
        #stage-boot .boot-welcome {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 0.85rem;
          opacity: 0;
          pointer-events: none;
          text-align: center;
          transition: opacity 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        #stage-boot.is-welcome .boot-marquee {
          opacity: 0;
          transition: opacity 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        #stage-boot.is-welcome .boot-welcome {
          opacity: 1;
        }
        #stage-boot .boot-kicker {
          font-family: "JetBrains Mono", ui-monospace, monospace;
          font-size: 10px;
          letter-spacing: 0.28em;
          text-transform: uppercase;
          color: #a8a2ff;
          opacity: 0;
          transform: translateY(8px);
        }
        #stage-boot .boot-name {
          font-family: "Space Grotesk", system-ui, sans-serif;
          font-size: clamp(2.4rem, 10vw, 6.5rem);
          font-weight: 600;
          letter-spacing: -0.05em;
          line-height: 0.88;
          text-transform: uppercase;
          color: #fafafc;
        }
        #stage-boot .boot-line {
          display: block;
          overflow: hidden;
        }
        #stage-boot .boot-line span {
          display: inline-block;
          opacity: 0;
          transform: translateY(108%);
        }
        #stage-boot .boot-role {
          font-family: "Space Grotesk", system-ui, sans-serif;
          font-size: clamp(1rem, 3vw, 1.5rem);
          font-weight: 600;
          background-image: linear-gradient(100deg, #a8a2ff, #948cd6, #7c6cc4);
          background-clip: text;
          -webkit-background-clip: text;
          color: transparent;
          opacity: 0;
          transform: translateY(10px);
        }
        #stage-boot.is-welcome .boot-kicker {
          animation: boot-fade-up 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        #stage-boot.is-welcome .boot-line span {
          animation: boot-letter 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards;
          animation-delay: calc(var(--i) * 48ms);
        }
        #stage-boot.is-welcome .boot-line:nth-child(2) span {
          animation-delay: calc(0.18s + var(--i) * 48ms);
        }
        #stage-boot.is-welcome .boot-role {
          animation: boot-fade-up 0.62s cubic-bezier(0.22, 1, 0.36, 1) 0.52s
            forwards;
        }
        @keyframes boot-marquee {
          from {
            transform: translateX(0);
          }
          to {
            transform: translateX(-50%);
          }
        }
        @keyframes boot-letter {
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
        @keyframes boot-fade-up {
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
        @media (prefers-reduced-motion: reduce) {
          #stage-boot .boot-marquee-track,
          #stage-boot.is-welcome .boot-kicker,
          #stage-boot.is-welcome .boot-line span,
          #stage-boot.is-welcome .boot-role {
            animation: none;
            opacity: 1;
            transform: none;
          }
        }
      </style>
      <div class="boot-marquee" aria-hidden="true">
        <div class="boot-marquee-track">
          <span>Software Engineer</span>
          <span>Developer</span>
          <span>Software Engineer</span>
          <span>Developer</span>
          <span>Software Engineer</span>
          <span>Developer</span>
          <span>Software Engineer</span>
          <span>Developer</span>
        </div>
      </div>
      <p class="boot-hint boot-hint-esc" aria-hidden="true">Esc to skip</p>
      <p class="boot-hint boot-hint-tap" aria-hidden="true">Tap to skip</p>
      <div class="boot-welcome" aria-hidden="true">
        <p class="boot-kicker">Welcome to my portfolio</p>
        <p class="boot-name">
          <span class="boot-line"
            ><span style="--i: 0">S</span><span style="--i: 1">A</span
            ><span style="--i: 2">M</span><span style="--i: 3">A</span
            ><span style="--i: 4">N</span></span
          >
          <span class="boot-line"
            ><span style="--i: 0">K</span><span style="--i: 1">H</span
            ><span style="--i: 2">A</span><span style="--i: 3">N</span></span
          >
        </p>
        <p class="boot-role">Software Engineer</p>
      </div>
      <button type="button" id="boot-skip" class="boot-skip">Continue</button>
    </div>
    <script>
      (function () {
        try {
          var reduce = window.matchMedia(
            "(prefers-reduced-motion: reduce)",
          ).matches;
          var compact = window.matchMedia("(max-width: 1023px)").matches;
          var boot = document.getElementById("stage-boot");
          var skip = document.getElementById("boot-skip");
          if ("scrollRestoration" in history) {
            history.scrollRestoration = "manual";
          }
          if (location.hash) {
            history.replaceState(null, "", location.pathname + location.search);
          }
          window.scrollTo(0, 0);
          window.addEventListener("load", function () {
            if (boot && boot.getAttribute("data-done") !== "true") {
              window.scrollTo(0, 0);
            }
          });
          function dismissBoot(atHero) {
            document.documentElement.setAttribute("data-skip-intro", "true");
            if (boot) boot.setAttribute("data-done", "true");
            document.body.style.overflow = "";
            document.querySelectorAll("[inert]").forEach(function (node) {
              node.removeAttribute("inert");
            });
            if (atHero) {
              document.documentElement.setAttribute(
                "data-intro-at-hero",
                "true",
              );
              if (location.hash) {
                history.replaceState(
                  null,
                  "",
                  location.pathname + location.search,
                );
              }
              window.scrollTo(0, 0);
            }
          }
          if (reduce && !compact) dismissBoot(false);
          if (skip)
            skip.addEventListener("click", function () {
              dismissBoot(true);
            });
          if (compact && boot) {
            if (reduce) {
              dismissBoot(false);
            } else {
              boot.addEventListener("click", function () {
                dismissBoot(true);
              });
            }
          }
        } catch (e) {}
      })();
    </script>
    <!--
      Crawlable portfolio content is injected into #root at build time
      (see scripts/seoStaticShell.ts). createRoot() replaces it on the client.
    -->
    <div id="root"></div>
    <noscript>
      <style>
        #stage-boot {
          display: none !important;
        }
        #seo-static-shell {
          display: block !important;
        }
      </style>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
